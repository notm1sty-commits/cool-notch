name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Иконку в формате macOS 26 (Icon Composer) умеет собрать только Xcode 26 на macOS 26.
  # Само приложение собирается как раньше; если этот шаг не получится, останется классическая иконка.
  icon:
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compile icon
        run: ./scripts/build-icon.sh "$RUNNER_TEMP/icon"
      - name: Upload icon
        uses: actions/upload-artifact@v4
        with:
          name: app-icon
          path: ${{ runner.temp }}/icon/Assets.car
          if-no-files-found: error

  build:
    needs: icon
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Icon for macOS 26
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-icon
          path: ${{ runner.temp }}/icon

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          ls -d /Applications/Xcode*.app || true
          # Окно установщика с фоном и стрелкой.
          brew install create-dmg || echo "create-dmg не поставился — будет простой DMG"

      # Необязательно: постоянный сертификат подписи (секреты MACOS_CERT_P12 в base64 и MACOS_CERT_PASSWORD).
      # С ним macOS не сбрасывает разрешения (Универсальный доступ, Полный доступ к диску) после обновления.
      - name: Signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "Сертификата нет — подпись ad-hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk -F'"' '/\)/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-certificate -a "$KEYCHAIN" | awk -F'"' '/"alis"/ {print $4; exit}')
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build app
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.3.{0}', github.run_number) }}
          BUILD_NUMBER: ${{ github.run_number }}
          PREBUILT_ICON_CAR: ${{ runner.temp }}/icon/Assets.car
        run: |
          VERSION="${VERSION#v}" ./scripts/build-app.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Halo-dmg
          path: .build/app/Halo.dmg
          if-no-files-found: error

      # Маленький файл для проверки обновлений: номер сборки и ссылка на архив. Приложение
      # скачивает его как обычный файл релиза — без GitHub API и его лимита 60 запросов в час.
      - name: Update manifest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/tags/v')
        env:
          BUILD: ${{ github.run_number }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.3.{0}', github.run_number) }}
        run: |
          TAG="build-$BUILD"
          PRERELEASE=false
          case "$GITHUB_REF" in
            refs/tags/v*) TAG="$GITHUB_REF_NAME" ;;
            refs/heads/claude/*) PRERELEASE=true ;;
          esac
          python3 - "$TAG" "$PRERELEASE" <<'PY'
          import json, os, sys
          tag, prerelease = sys.argv[1], sys.argv[2] == "true"
          repo = os.environ["GITHUB_REPOSITORY"]
          version = os.environ["VERSION"].lstrip("v")
          json.dump({
              "build": int(os.environ["BUILD"]),
              "version": version,
              "tag": tag,
              "prerelease": prerelease,
              "zip": f"https://github.com/{repo}/releases/download/{tag}/Halo.zip",
              "page": f"https://github.com/{repo}/releases/tag/{tag}",
          }, open(".build/app/update.json", "w"), ensure_ascii=False)
          PY
          cat .build/app/update.json

      # Каждая сборка main становится релизом — кнопка «Обновить» в приложении берёт его отсюда.
      - name: Publish build release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Halo 0.3.${{ github.run_number }} (build ${{ github.run_number }})
          make_latest: "true"
          generate_release_notes: true
          files: |
            .build/app/Halo.dmg
            .build/app/Halo.zip
            .build/app/update.json

      # Сборки из веток разработки — «тестовые» (предварительные) релизы. Их видит кнопка
      # «Обновить», если в настройках включены «Тестовые сборки».
      - name: Publish test build
        if: startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Halo 0.3.${{ github.run_number }} (build ${{ github.run_number }}, тестовая)
          prerelease: true
          make_latest: "false"
          body: Тестовая сборка из ветки ${{ github.ref_name }} (${{ github.sha }}).
          files: |
            .build/app/Halo.dmg
            .build/app/Halo.zip
            .build/app/update.json

      # Тестовый канал: постоянный релиз «beta», где update.json всегда указывает на самую
      # свежую сборку (тестовую или из main). Его читают те, у кого включены «Тестовые сборки».
      - name: Publish beta channel
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Halo — тестовый канал (build ${{ github.run_number }})
          prerelease: true
          make_latest: "false"
          body: Служебный релиз для кнопки «Обновить» с включёнными «Тестовыми сборками». Скачивать Halo лучше из обычного релиза.
          files: |
            .build/app/update.json

      # Тестовые сборки не копятся: после сборки main удаляются все тестовые релизы
      # (вместе с архивами и тегами), после тестовой остаются только три последние.
      - name: Clean up old test builds
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=3
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then keep=0; fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease and .tagName != \"beta\")] | sort_by(.createdAt) | reverse | .[$keep:] | .[].tagName" |
          while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Удаляю $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            fi
          done

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Halo ${{ github.ref_name }} (build ${{ github.run_number }})
          make_latest: "true"
          files: |
            .build/app/Halo.dmg
            .build/app/Halo.zip
            .build/app/update.json
          generate_release_notes: true
